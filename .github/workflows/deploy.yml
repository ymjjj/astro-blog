name: Deploy static blog to GitHub Pages
run-name: Blog deploy · ${{ inputs.blog_request_id || github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      blog_request_id:
        description: Local publish job ID for status correlation
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - name: Build and verify
        run: npm run build && npm run verify
        env:
          BLOG_SITE: ${{ steps.pages.outputs.origin }}
          BLOG_BASE: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
